[project]
site_url = "https://spygaurad.github.io/GeoTalosDocs/"
site_name = "GeoTALOS Documentation"
site_description = "User and developer documentation for GeoTALOS, a geoscience platform for automated landscape observation and spatial analysis."
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/spygaurad/GeoTalosProd"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Key Concepts" = [
    "concepts/index.md",
    { "Organizations, projects and roles" = "concepts/organizations.md" },
    { "Datasets and the data library" = "concepts/datasets.md" },
    { "Areas of interest" = "concepts/aois.md" },
    { "Annotation sets" = "concepts/annotations.md" },
    { "Workflows and nodes" = "concepts/workflows.md" },
    { "Provenance" = "concepts/provenance.md" }
  ] },
  { "User Guide" = [
    "user-guide/index.md",
    { "Getting started" = "user-guide/getting-started.md" },
    { "Uploading imagery" = "user-guide/uploading-imagery.md" },
    { "The map workspace" = "user-guide/map-workspace.md" },
    { "Reference layers" = "user-guide/reference-layers.md" },
    { "Running models" = "user-guide/running-models.md" },
    { "Reviewing annotations" = "user-guide/reviewing-annotations.md" },
    { "Temporal analysis" = "user-guide/temporal-analysis.md" },
    { "Building workflows" = "user-guide/building-workflows.md" },
    { "Automation" = "user-guide/automation.md" },
    { "Reports and export" = "user-guide/reports-export.md" }
  ] },
  { "Tutorials" = [
    "tutorials/index.md",
    { "Palm crown detection" = "tutorials/palm-crown-detection.md" },
    { "Multi-AOI palm analysis" = "tutorials/multi-aoi-palm-analysis.md" },
    { "Multi-prompt segmentation" = "tutorials/multi-prompt-segmentation.md" },
    { "Temporal feature mapping" = "tutorials/temporal-feature-mapping.md" },
    { "NDVI monitoring" = "tutorials/ndvi-monitoring.md" }
  ] },
  { "Developer Guide" = [
    "developer/index.md",
    { "Architecture" = "developer/architecture.md" },
    { "Local setup and deployment" = "developer/local-setup.md" },
    { "Multi-tenancy" = "developer/multi-tenancy.md" },
    { "Data ingestion" = "developer/data-ingestion.md" },
    { "API endpoints" = "developer/api.md" },
    { "Database schema and migrations" = "developer/database.md" },
    { "Adding a model" = "developer/adding-a-model.md" },
    { "Model training pipeline" = "developer/training-pipeline.md" },
    { "The workflow engine" = "developer/workflow-engine.md" },
    { "Tiles, caching and reference layers" = "developer/tiles.md" }
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Glossary" = "reference/glossary.md" },
    { "FAQ" = "reference/faq.md" },
    { "Data sources and licences" = "reference/data-sources.md" },
    { "Changelog" = "reference/changelog.md" }
  ] },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" width="1050" height="400" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How imagery is ingested</title><desc id="d">The browser uploads the file to MinIO in 50 MiB parts using presigned URLs from the API. Completing the upload queues an ingestion job that validates the GeoTIFF, reads its metadata, upserts a STAC Item into pgSTAC and creates a DatasetItem row in the application database.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="1050" height="400" fill="#FFFFFF"/><text x="30" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">1. UPLOAD</text><text x="560" y="254" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">2. INGESTION JOB (Celery, queue: ingestion)</text><rect x="30" y="50" width="190" height="150" rx="10" fill="#EAF4E4" stroke="#5E8C3A" stroke-width="2"/><text x="125.0" y="76" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Browser</text><text x="125.0" y="100" text-anchor="middle" font-size="13.5" fill="#4A4A4A">splits the file</text><text x="125.0" y="120" text-anchor="middle" font-size="13.5" fill="#4A4A4A">into 50 MiB parts</text><rect x="300" y="50" width="220" height="110" rx="10" fill="#EFEFEF" stroke="#6B6B6B" stroke-width="2"/><text x="410.0" y="76" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">API</text><text x="410.0" y="100" text-anchor="middle" font-size="13.5" fill="#4A4A4A">initiate: part URLs</text><text x="410.0" y="120" text-anchor="middle" font-size="13.5" fill="#4A4A4A">complete: queue job</text><rect x="640" y="50" width="220" height="150" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="750.0" y="76" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">MinIO</text><text x="750.0" y="100" text-anchor="middle" font-size="13.5" fill="#4A4A4A">parts go straight</text><text x="750.0" y="120" text-anchor="middle" font-size="13.5" fill="#4A4A4A">here, not through</text><text x="750.0" y="140" text-anchor="middle" font-size="13.5" fill="#4A4A4A">the API</text><line x1="220" y1="95" x2="298" y2="95" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="259.0" y="87.0" text-anchor="middle" font-size="12.5" fill="#4A4A4A">initiate</text><line x1="220" y1="185" x2="638" y2="185" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="429.0" y="203.0" text-anchor="middle" font-size="12.5" fill="#4A4A4A">PUT each part with a presigned URL</text><line x1="220" y1="135" x2="298" y2="135" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="259.0" y="127.0" text-anchor="middle" font-size="12.5" fill="#4A4A4A">complete</text><rect x="30" y="270" width="215" height="110" rx="10" fill="#FCEBDD" stroke="#C46A1C" stroke-width="2"/><text x="137.5" y="296" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Validate</text><text x="137.5" y="320" text-anchor="middle" font-size="13.5" fill="#4A4A4A">GDAL opens it,</text><text x="137.5" y="340" text-anchor="middle" font-size="13.5" fill="#4A4A4A">COG warnings</text><rect x="285" y="270" width="215" height="110" rx="10" fill="#FCEBDD" stroke="#C46A1C" stroke-width="2"/><text x="392.5" y="296" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Read metadata</text><text x="392.5" y="320" text-anchor="middle" font-size="13.5" fill="#4A4A4A">bounds, CRS, bands,</text><text x="392.5" y="340" text-anchor="middle" font-size="13.5" fill="#4A4A4A">acquisition date</text><line x1="245" y1="325" x2="283" y2="325" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="270" width="215" height="110" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="647.5" y="296" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">STAC Item</text><text x="647.5" y="320" text-anchor="middle" font-size="13.5" fill="#4A4A4A">upsert into</text><text x="647.5" y="340" text-anchor="middle" font-size="13.5" fill="#4A4A4A">pgSTAC</text><line x1="500" y1="325" x2="538" y2="325" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="795" y="270" width="215" height="110" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="902.5" y="296" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">DatasetItem</text><text x="902.5" y="320" text-anchor="middle" font-size="13.5" fill="#4A4A4A">row in app-db</text><text x="902.5" y="340" text-anchor="middle" font-size="13.5" fill="#4A4A4A">+ dataset summary</text><line x1="755" y1="325" x2="793" y2="325" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="360" y1="160" x2="140" y2="268" stroke="#555" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 420" width="1050" height="420" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How Martin serves vector tiles</title><desc id="d">The browser map asks the API for vector tiles. Annotation tiles pass an organization check and a Redis cache; reference tiles pass a layer allowlist. The API forwards to Martin, which reads annotation sets and Ramsar from PostGIS and the other seven reference layers from PMTiles files in MinIO.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="1050" height="420" fill="#FFFFFF"/><text x="30" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">BROWSER</text><text x="260" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">API (FastAPI)</text><text x="560" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">MARTIN</text><text x="800" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">SOURCES</text><rect x="30" y="60" width="180" height="290" rx="10" fill="#EAF4E4" stroke="#5E8C3A" stroke-width="2"/><text x="120.0" y="86" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Map</text><text x="120.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">Leaflet</text><text x="120.0" y="130" text-anchor="middle" font-size="13.5" fill="#4A4A4A">vector tile layer</text><text x="120.0" y="150" text-anchor="middle" font-size="13.5" fill="#4A4A4A">(MVT, .pbf)</text><rect x="260" y="60" width="250" height="130" rx="10" fill="#EFEFEF" stroke="#6B6B6B" stroke-width="2"/><text x="385.0" y="86" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Annotation tiles</text><text x="385.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">org role check</text><text x="385.0" y="130" text-anchor="middle" font-size="13.5" fill="#4A4A4A">set must belong to org</text><text x="385.0" y="150" text-anchor="middle" font-size="13.5" fill="#4A4A4A">Redis tile cache</text><rect x="260" y="220" width="250" height="130" rx="10" fill="#EFEFEF" stroke="#6B6B6B" stroke-width="2"/><text x="385.0" y="246" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Reference tiles</text><text x="385.0" y="270" text-anchor="middle" font-size="13.5" fill="#4A4A4A">layer name allowlist</text><text x="385.0" y="290" text-anchor="middle" font-size="13.5" fill="#4A4A4A">anything else: 404</text><text x="385.0" y="310" text-anchor="middle" font-size="13.5" fill="#4A4A4A">public, 1 day cache</text><rect x="560" y="60" width="190" height="290" rx="10" fill="#FCEBDD" stroke="#C46A1C" stroke-width="2"/><text x="655.0" y="86" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Martin</text><text x="655.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">vector tile server</text><text x="655.0" y="130" text-anchor="middle" font-size="13.5" fill="#4A4A4A"></text><text x="655.0" y="150" text-anchor="middle" font-size="13.5" fill="#4A4A4A">never on a host port</text><text x="655.0" y="170" text-anchor="middle" font-size="13.5" fill="#4A4A4A">reached only</text><text x="655.0" y="190" text-anchor="middle" font-size="13.5" fill="#4A4A4A">through the API</text><rect x="800" y="60" width="220" height="130" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="910.0" y="86" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">PostGIS</text><text x="910.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">annotation_set_mvt</text><text x="910.0" y="130" text-anchor="middle" font-size="13.5" fill="#4A4A4A">function</text><text x="910.0" y="150" text-anchor="middle" font-size="13.5" fill="#4A4A4A">reference.ramsar</text><rect x="800" y="220" width="220" height="130" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="910.0" y="246" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">PMTiles in MinIO</text><text x="910.0" y="270" text-anchor="middle" font-size="13.5" fill="#4A4A4A">bucket reference-tiles</text><text x="910.0" y="290" text-anchor="middle" font-size="13.5" fill="#4A4A4A">7 layers, Tippecanoe</text><text x="910.0" y="310" text-anchor="middle" font-size="13.5" fill="#4A4A4A">read-only user</text><line x1="210" y1="125" x2="258" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="210" y1="285" x2="258" y2="285" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="510" y1="125" x2="558" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="510" y1="285" x2="558" y2="285" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="750" y1="125" x2="798" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="750" y1="285" x2="798" y2="285" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="30" y="385" font-size="13" fill="#4A4A4A">Private annotation tiles: /api/v1/annotation-sets/{set_id}/tiles/{z}/{x}/{y}.pbf</text><text x="30" y="405" font-size="13" fill="#4A4A4A">Public reference tiles: /api/v1/reference-layers/{name}/tiles/{z}/{x}/{y}.pbf</text></svg>

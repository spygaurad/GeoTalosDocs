<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 300" width="1050" height="300" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Celery worker queues</title><desc id="d">The API and Celery Beat put jobs on named queues in the Redis broker. Five worker containers each listen to their own queues: ingestion and discovery; bulk; analysis and automation; inference, embedding and training; default.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="1050" height="300" fill="#FFFFFF"/><rect x="30" y="40" width="200" height="90" rx="10" fill="#EFEFEF" stroke="#6B6B6B" stroke-width="2"/><text x="130.0" y="66" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">API</text><text x="130.0" y="90" text-anchor="middle" font-size="13.5" fill="#4A4A4A">queues slow jobs</text><rect x="30" y="160" width="200" height="90" rx="10" fill="#F6EEDC" stroke="#8C6D2C" stroke-width="2"/><text x="130.0" y="186" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Celery Beat</text><text x="130.0" y="210" text-anchor="middle" font-size="13.5" fill="#4A4A4A">schedules</text><rect x="330" y="85" width="200" height="120" rx="10" fill="#FCEBDD" stroke="#C46A1C" stroke-width="2"/><text x="430.0" y="111" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Redis broker</text><text x="430.0" y="135" text-anchor="middle" font-size="13.5" fill="#4A4A4A">named queues</text><line x1="230" y1="85" x2="328" y2="125" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="230" y1="205" x2="328" y2="165" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="10" width="380" height="50" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="830.0" y="41.0" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A"></text><text x="660" y="41" font-weight="700" font-size="15" fill="#1A1A1A">ingestion worker</text><text x="1005" y="41" text-anchor="end" font-size="13" fill="#4A4A4A">ingestion, discovery</text><line x1="530" y1="145" x2="638" y2="35" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="68" width="380" height="50" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="830.0" y="99.0" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A"></text><text x="660" y="99" font-weight="700" font-size="15" fill="#1A1A1A">bulk worker</text><text x="1005" y="99" text-anchor="end" font-size="13" fill="#4A4A4A">bulk</text><line x1="530" y1="145" x2="638" y2="93" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="126" width="380" height="50" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="830.0" y="157.0" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A"></text><text x="660" y="157" font-weight="700" font-size="15" fill="#1A1A1A">analysis worker</text><text x="1005" y="157" text-anchor="end" font-size="13" fill="#4A4A4A">analysis, automation</text><line x1="530" y1="145" x2="638" y2="151" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="184" width="380" height="50" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="830.0" y="215.0" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A"></text><text x="660" y="215" font-weight="700" font-size="15" fill="#1A1A1A">inference worker</text><text x="1005" y="215" text-anchor="end" font-size="13" fill="#4A4A4A">inference, embedding, training</text><line x1="530" y1="145" x2="638" y2="209" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="242" width="380" height="50" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="830.0" y="273.0" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A"></text><text x="660" y="273" font-weight="700" font-size="15" 
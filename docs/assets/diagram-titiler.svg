<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330" width="1050" height="330" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How TiTiler serves imagery tiles</title><desc id="d">The browser map asks the API tile proxy for raster tiles. The API forwards to TiTiler, which looks up the scenes in pgSTAC and reads only the needed byte ranges of the COG files in MinIO.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><rect width="1050" height="330" fill="#FFFFFF"/><text x="30" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">BROWSER</text><text x="260" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">API (FastAPI)</text><text x="530" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">TITILER</text><text x="790" y="34" text-anchor="start" font-weight="700" font-size="14" fill="#8C6D2C" letter-spacing="0.5">STORAGE</text><rect x="30" y="60" width="180" height="200" rx="10" fill="#EAF4E4" stroke="#5E8C3A" stroke-width="2"/><text x="120.0" y="86" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Map</text><text x="120.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">Leaflet</text><text x="120.0" y="130" text-anchor="middle" font-size="13.5" fill="#4A4A4A">raster tile layer</text><text x="120.0" y="150" text-anchor="middle" font-size="13.5" fill="#4A4A4A">PNG, JPEG, WebP</text><rect x="260" y="60" width="220" height="200" rx="10" fill="#EFEFEF" stroke="#6B6B6B" stroke-width="2"/><text x="370.0" y="86" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">Tile proxy</text><text x="370.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">/api/v1/tiles/...</text><text x="370.0" y="130" text-anchor="middle" font-size="13.5" fill="#4A4A4A">one scene,</text><text x="370.0" y="150" text-anchor="middle" font-size="13.5" fill="#4A4A4A">a whole dataset,</text><text x="370.0" y="170" text-anchor="middle" font-size="13.5" fill="#4A4A4A">or a STAC mosaic</text><rect x="530" y="60" width="210" height="200" rx="10" fill="#FCEBDD" stroke="#C46A1C" stroke-width="2"/><text x="635.0" y="86" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">TiTiler</text><text x="635.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">reads only the bytes</text><text x="635.0" y="130" text-anchor="middle" font-size="13.5" fill="#4A4A4A">each tile needs</text><text x="635.0" y="150" text-anchor="middle" font-size="13.5" fill="#4A4A4A">(HTTP range requests)</text><rect x="790" y="40" width="230" height="110" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="905.0" y="66" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">pgSTAC</text><text x="905.0" y="90" text-anchor="middle" font-size="13.5" fill="#4A4A4A">catalog search:</text><text x="905.0" y="110" text-anchor="middle" font-size="13.5" fill="#4A4A4A">which COGs cover this tile</text><rect x="790" y="170" width="230" height="110" rx="10" fill="#E3F0F8" stroke="#2F6F9A" stroke-width="2"/><text x="905.0" y="196" text-anchor="middle" font-weight="700" font-size="17" fill="#1A1A1A">MinIO</text><text x="905.0" y="220" text-anchor="middle" font-size="13.5" fill="#4A4A4A">COG files, read</text><text x="905.0" y="240" text-anchor="middle" font-size="13.5" fill="#4A4A4A">by byte range</text><line x1="210" y1="160" x2="258" y2="160" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="480" y1="160" x2="528" y2="160" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="740" y1="110" x2="788" y2="95" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="740" y1="210" x2="788" y2="225" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="525" y="312" text-anchor="middle" font-size="13" fill="#4A4A4A">The image never leaves storage as a whole file: only the tiles on screen are cut and sent.</text></svg>
